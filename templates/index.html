<!DOCTYPE html>
<html>

<head>

<title>Draft League Prize Tracker</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
font-family: Arial, sans-serif;
background:#0f172a;
color:white;
margin:0;
padding:20px;
}

h1{
text-align:center;
margin-bottom:30px;
}

.dashboard{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
margin-bottom:30px;
}

.card{
background:#1e293b;
padding:20px;
border-radius:10px;
text-align:center;
box-shadow:0 6px 12px rgba(0,0,0,0.4);
}

.card h2{
margin:0;
font-size:18px;
color:#94a3b8;
}

.card p{
font-size:28px;
margin:10px 0 0;
font-weight:bold;
}

table{
width:100%;
border-collapse:collapse;
background:#1e293b;
border-radius:10px;
overflow:hidden;
}

th, td{
padding:10px;
text-align:center;
}

th{
background:#334155;
}

tr:nth-child(even){
background:#1f2a3d;
}

.gwWinner{
background:#16a34a;
font-weight:bold;
}

.chart-container{
background:#1e293b;
padding:20px;
border-radius:10px;
margin-top:30px;
}

</style>

</head>

<body>

<h1>🏆 Draft League Prize Tracker</h1>

<div class="dashboard">

<div class="card">
<h2>🥇 Leader</h2>
<p id="leader"></p>
</div>

<div class="card">
<h2>💰 Money Leader</h2>
<p id="moneyLeader"></p>
</div>

<div class="card">
<h2>🔥 Highest GW Score</h2>
<p id="bestScore"></p>
</div>

<div class="card">
<h2>🏆 Most Weekly Wins</h2>
<p id="mostWins"></p>
</div>

</div>

<table id="leagueTable">

<thead></thead>
<tbody></tbody>

</table>

<div class="chart-container">

<h2>Season Points</h2>
<canvas id="pointsChart"></canvas>

</div>

<div class="chart-container">

<h2>Season Race</h2>
<canvas id="raceChart"></canvas>

</div>

<script>

let chartInstance;
let raceChart;

async function loadData(){

const res = await fetch("/api/scores");
const data = await res.json();

buildTable(data);
buildDashboard(data);
buildPointsChart(data);
buildRaceChart(data);

}

function buildDashboard(data){

const leader = data[0];

document.getElementById("leader").innerText =
leader.Team + " (" + leader.Total + " pts)";

let moneyLeader = data.reduce((a,b)=> a["Overall $"] > b["Overall $"] ? a : b);

document.getElementById("moneyLeader").innerText =
moneyLeader.Team + " $" + moneyLeader["Overall $"];

let bestScore = 0;
let bestTeam = "";

data.forEach(team=>{
Object.keys(team).forEach(k=>{
if(!isNaN(k)){
if(team[k] > bestScore){
bestScore = team[k];
bestTeam = team.Team;
}
}
});
});

document.getElementById("bestScore").innerText =
bestTeam + " (" + bestScore + ")";

let mostWins = data.reduce((a,b)=> a["Weekly Wins"] > b["Weekly Wins"] ? a : b);

document.getElementById("mostWins").innerText =
mostWins.Team + " (" + mostWins["Weekly Wins"] + ")";

}

function buildTable(data){

const table = document.getElementById("leagueTable");

const headers = Object.keys(data[0]);

const gwColumns = headers.filter(h => !isNaN(h));

let gwMax = {};

gwColumns.forEach(gw => {

gwMax[gw] = Math.max(...data.map(t => t[gw]));

});

let thead = "<tr>";

headers.forEach(h => {

thead += "<th>" + h + "</th>";

});

thead += "</tr>";

table.querySelector("thead").innerHTML = thead;

let rows = "";

data.forEach(team => {

rows += "<tr>";

headers.forEach(h => {

let value = team[h];
let cellClass = "";
let star = "";

if(gwColumns.includes(h) && value == gwMax[h]){

cellClass = "gwWinner";
star = " ⭐";

}

rows += "<td class='"+cellClass+"'>" + value + star + "</td>";

});

rows += "</tr>";

});

table.querySelector("tbody").innerHTML = rows;

}

function buildPointsChart(data){

const labels = data.map(t=>t.Team);
const totals = data.map(t=>t.Total);

if(chartInstance){
chartInstance.destroy();
}

chartInstance = new Chart(document.getElementById("pointsChart"),{

type:"bar",

data:{
labels:labels,
datasets:[{
label:"Season Points",
data:totals
}]
},

options:{
plugins:{
legend:{display:false}
}
}

});

}

function buildRaceChart(data){

const gwColumns = Object.keys(data[0]).filter(x=>!isNaN(x));

let datasets = data.map(team => {

let cumulative = 0;
let points = [];

gwColumns.forEach(gw => {

cumulative += team[gw];
points.push(cumulative);

});

return {
label: team.Team,
data: points,
fill:false
};

});

if(raceChart){
raceChart.destroy();
}

raceChart = new Chart(document.getElementById("raceChart"),{

type:"line",

data:{
labels:gwColumns,
datasets:datasets
}

});

}

loadData();

setInterval(loadData,300000);

</script>

</body>

</html>
